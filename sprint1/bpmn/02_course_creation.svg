  <text x="30" y="35" font-size="20" font-weight="700" fill="#1e293b">BPMN 2.0: Процес «Створення та наповнення курсу» (ЕдуПортал)</text>
  <text x="30" y="55" font-size="12" fill="#64748b">Команда EduGuard | Автор: 5ani0chek (ІТ) | Рецензент: Vov4ik (ТА)</text>
  <g transform="translate(30, 70)">
