  <text x="1060" y="55" font-size="12" fill="#64748b">Команда: EduGuard | Автор: 5ani0chek (ІТ) | Рецензент: Vov4ik (ТА)</text>

  <!-- Pool 1: Student -->
  <rect x="160" y="80" width="1380" height="310" fill="#f8fafc" stroke="#334155" stroke-width="2" />
