<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 25 1400 675" width="100%" height="auto" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="msg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" stroke="#334155" stroke-width="2" />
    </marker>
    <marker id="msg-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <circle cx="5" cy="5" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="160" y="55" font-size="22" font-weight="bold" fill="#0f172a">BPMN 2.0: Модель процесу 3 «Проходження тесту» (Quiz Attempt)</text>
  <text x="1020" y="55" font-size="14" font-weight="600" fill="#475569">Команда: EduGuard | Автор: 5ani0chek | Рецензент: Vov4ik</text>

  <!-- Pool 1: Student -->
  <rect x="160" y="80" width="1380" height="310" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <rect x="160" y="80" width="38" height="310" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
  <text x="-235" y="184" transform="rotate(-90)" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Студент</text>

  <!-- Start Event Student -->
  <circle cx="248" cy="210" r="20" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" />
