  <!-- Task Student Request -->
  <rect x="300" y="170" width="120" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="360" y="206" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Натиснути кнопку</text>
  <text x="360" y="226" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">«Почати спробу»</text>

  <!-- Gateway Student WaitStart -->
  <polygon points="485,185 510,210 485,235 460,210" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <polygon points="485,193 502,210 485,227 468,210" fill="none" stroke="#d97706" stroke-width="1.5" />
  <text x="485" y="172" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Очікування допуску</text>

  <!-- Event Catch No Attempts -->
  <circle cx="563" cy="130" r="20" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
