<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 20 1500 720" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
