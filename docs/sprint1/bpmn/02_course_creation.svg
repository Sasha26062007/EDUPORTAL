<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 15 1380 660" width="100%" height="auto" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="rework-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="160" y="52" font-size="22" font-weight="bold" fill="#0f172a">BPMN 2.0: Модель процесу 4 «Створення та наповнення курсу» (Course Creation)</text>
  <text x="1000" y="52" font-size="14" font-weight="600" fill="#475569">Команда: EduGuard | Автор: 5ani0chek (ІТ) | Рецензент: Vov4ik (ТА)</text>

  <!-- Pool: EduPortal -->
  <rect x="160" y="75" width="1350" height="590" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <rect x="160" y="75" width="36" height="590" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
  <text x="-370" y="184" transform="rotate(-90)" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Система ЕдуПортал (Створення курсу)</text>

  <!-- Lane 1: Manager -->
  <rect x="196" y="75" width="1314" height="175" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="196" y="75" width="30" height="175" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="-162" y="216" transform="rotate(-90)" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Менеджер курсів</text>

  <!-- Lane 2: Teacher -->
  <rect x="196" y="250" width="1314" height="280" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="196" y="250" width="30" height="280" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="-390" y="216" transform="rotate(-90)" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Викладач</text>

  <!-- Lane 3: System LMS -->
  <rect x="196" y="530" width="1314" height="135" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="196" y="530" width="30" height="135" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="-597" y="216" transform="rotate(-90)" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Система LMS</text>

  <!-- Start Event Manager -->
  <circle cx="260" cy="150" r="20" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" />
  <text x="260" y="190" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Отримано заявку</text>
  <text x="260" y="206" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">на курс</text>

  <!-- Task Create Shell -->
  <rect x="320" y="110" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="390" y="145" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Створити курс у категорії</text>
  <text x="390" y="163" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">та призначити викладача</text>

  <!-- Data Object CourseMat -->
  <rect x="372" y="18" width="36" height="46" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <polyline points="394,18 408,30 394,30 394,18" fill="#e2e8f0" stroke="#334155" stroke-width="1.5" />
  <text x="390" y="12" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Матеріали курсу</text>

  <!-- Gateway XOR Merge (Rework & Initial) -->
  <polygon points="455,365 480,390 455,415 430,390" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="455" y="386" font-size="20" font-weight="bold" fill="#d97706" text-anchor="middle">×</text>
  <text x="455" y="435" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">Вхід / Злиття</text>
  <text x="455" y="450" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">доопрацювання</text>

  <!-- Gateway Fork Content (Parallel AND) -->
  <polygon points="545,365 570,390 545,415 520,390" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="545" y="398" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="middle">+</text>
  <text x="545" y="435" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Паралельне</text>
  <text x="545" y="450" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">наповнення</text>

  <!-- 4 Parallel Tasks -->
  <rect x="610" y="270" width="140" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="680" y="292" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Завантажити лекційні</text>
  <text x="680" y="308" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">матеріали та медіа</text>

  <rect x="610" y="330" width="140" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="680" y="352" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Створити практичні</text>
  <text x="680" y="368" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">завдання й дедлайни</text>

  <rect x="610" y="390" width="140" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="680" y="412" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Сформувати банк</text>
  <text x="680" y="428" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">тестових питань</text>

  <rect x="610" y="450" width="140" height="52" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="680" y="472" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Налаштувати форум</text>
  <text x="680" y="488" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">та оголошення курсу</text>

  <!-- Gateway Join Content (Parallel AND) -->
  <polygon points="815,365 840,390 815,415 790,390" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="815" y="398" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="middle">+</text>
  <text x="815" y="435" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Синхронізація</text>
  <text x="815" y="450" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">наповнення</text>

  <!-- Task Configure Enrollment -->
  <rect x="880" y="350" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="950" y="385" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Налаштувати методи</text>
  <text x="950" y="403" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">зарахування та</text>
  <text x="950" y="420" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">кодове слово</text>

  <!-- Task Audit Course (Manager) -->
  <rect x="880" y="110" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="950" y="145" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Провести аудит</text>
  <text x="950" y="163" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">наповнення та</text>
  <text x="950" y="180" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">налаштувань курсу</text>

  <!-- Gateway Audit Check (XOR) -->
  <polygon points="1075,125 1100,150 1075,175 1050,150" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="1075" y="112" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Вимоги виконано?</text>

  <!-- Task Notify Rework -->
  <rect x="1140" y="110" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="1210" y="145" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Надіслати зауваження</text>
  <text x="1210" y="163" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">викладачу на</text>
  <text x="1210" y="180" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">доопрацювання</text>

  <!-- Task Publish Course (System LMS) -->
  <rect x="1140" y="555" width="140" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="1210" y="590" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Опублікувати курс</text>
  <text x="1210" y="608" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">та відкрити доступ</text>
  <text x="1210" y="625" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">у каталозі</text>

  <!-- End Event Published -->
  <circle cx="1340" cy="595" r="20" fill="#ecfdf5" stroke="#059669" stroke-width="4" />
  <text x="1340" y="632" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">Курс опубліковано</text>
  <text x="1340" y="648" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">у каталозі</text>

  <!-- Annotation 2 -->
  <path d="M 520 545 L 500 545 L 500 600 L 520 600" fill="none" stroke="#64748b" stroke-width="2" />
  <text x="510" y="568" font-size="12" font-weight="600" fill="#475569">Паралельне формування контенту</text>
  <text x="510" y="586" font-size="12" font-weight="600" fill="#475569">згідно зі стандартом дисципліни</text>
  <path d="M 570 545 L 550 410" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Sequence Flows -->
  <path d="M 280 150 L 320 150" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 390 190 L 390 390 L 430 390" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 480 390 L 520 390" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fork to 4 branches -->
  <path d="M 545 365 L 545 296 L 610 296" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 562 382 L 562 356 L 610 356" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 562 398 L 562 416 L 610 416" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 545 415 L 545 476 L 610 476" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4 branches to Join -->
  <path d="M 750 296 L 815 296 L 815 365" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 750 356 L 798 356 L 798 382" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 750 416 L 798 416 L 798 398" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 750 476 L 815 476 L 815 415" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Join to Enrollment -->
  <path d="M 840 390 L 880 390" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Enrollment to Audit -->
  <path d="M 950 350 L 950 190" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Audit to Gateway -->
  <path d="M 1020 150 L 1050 150" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Gateway branches -->
  <path d="M 1100 150 L 1140 150" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1112" y="142" font-size="13" fill="#dc2626" font-weight="bold">Ні</text>

  <path d="M 1075 175 L 1075 595 L 1140 595" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1084" y="210" font-size="13" fill="#16a34a" font-weight="bold">Так</text>

  <!-- Rework Loop back to XOR Merge Gateway (NO DEADLOCK) -->
  <path d="M 1210 110 L 1210 58 L 455 58 L 455 365" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#rework-arrow)" />
  <text x="760" y="50" font-size="12" fill="#b45309" font-weight="bold">Петля доопрацювання курсу (вхід у XOR Merge перед AND Fork)</text>

  <!-- Publish to End -->
  <path d="M 1280 595 L 1320 595" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Data association -->
  <path d="M 390 110 L 390 64" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
