<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 20 1460 700" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="160" y="55" font-size="18" font-weight="bold" fill="#1e293b">BPMN 2.0: Модель процесу 4 «Створення та наповнення курсу» (Course Creation)</text>
  <text x="1000" y="55" font-size="12" fill="#64748b">Команда: EduGuard | Автор: 5ani0chek (ІТ) | Рецензент: Vov4ik (ТА)</text>

  <!-- Pool: EduPortal -->
  <rect x="160" y="80" width="1340" height="580" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <rect x="160" y="80" width="30" height="580" fill="#e2e8f0" stroke="#334155" stroke-width="1" />
  <text x="-370" y="180" transform="rotate(-90)" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Система ЕдуПортал (Створення курсу)</text>

  <!-- Lane 1: Manager -->
  <rect x="190" y="80" width="1310" height="170" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="190" y="80" width="25" height="170" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="-165" y="207" transform="rotate(-90)" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Менеджер курсів</text>

  <!-- Lane 2: Teacher -->
  <rect x="190" y="250" width="1310" height="280" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="190" y="250" width="25" height="280" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="-390" y="207" transform="rotate(-90)" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Викладач</text>

  <!-- Lane 3: System LMS -->
  <rect x="190" y="530" width="1310" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="190" y="530" width="25" height="130" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="-595" y="207" transform="rotate(-90)" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Система LMS</text>

  <!-- Start Event Manager -->
  <circle cx="250" cy="150" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="250" y="188" font-size="10" fill="#065f46" text-anchor="middle">Отримано заявку</text>
  <text x="250" y="200" font-size="10" fill="#065f46" text-anchor="middle">на створення курсу</text>

  <!-- Task Create Shell -->
  <rect x="310" y="110" width="140" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="380" y="145" font-size="11" fill="#1e293b" text-anchor="middle">Створити курс у категорії</text>
  <text x="380" y="160" font-size="11" fill="#1e293b" text-anchor="middle">та призначити викладача</text>

  <!-- Data Object CourseMat -->
  <rect x="362" y="15" width="36" height="50" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <polyline points="386,15 398,27 386,27 386,15" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <text x="380" y="8" font-size="10" fill="#475569" text-anchor="middle">Матеріали курсу</text>

  <!-- Gateway XOR Merge (Rework & Initial) -->
  <polygon points="455,365 480,390 455,415 430,390" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="455" y="385" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle">×</text>
  <text x="455" y="435" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Синхронізація входу/</text>
  <text x="455" y="447" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">повернення</text>

  <!-- Gateway Fork Content (Parallel AND) -->
  <polygon points="545,365 570,390 545,415 520,390" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="545" y="396" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">+</text>
  <text x="545" y="435" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Паралельне наповнення</text>
  <text x="545" y="447" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">компонентів курсу</text>

  <!-- 4 Parallel Tasks -->
  <rect x="610" y="270" width="130" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="675" y="292" font-size="10" fill="#1e293b" text-anchor="middle">Завантажити лекційні</text>
  <text x="675" y="305" font-size="10" fill="#1e293b" text-anchor="middle">ресурси та матеріали</text>

  <rect x="610" y="330" width="130" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="675" y="352" font-size="10" fill="#1e293b" text-anchor="middle">Створити практичні</text>
  <text x="675" y="365" font-size="10" fill="#1e293b" text-anchor="middle">завдання та дедлайни</text>

  <rect x="610" y="390" width="130" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="675" y="412" font-size="10" fill="#1e293b" text-anchor="middle">Сформувати банк</text>
  <text x="675" y="425" font-size="10" fill="#1e293b" text-anchor="middle">тестових питань</text>

  <rect x="610" y="450" width="130" height="50" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="675" y="472" font-size="10" fill="#1e293b" text-anchor="middle">Налаштувати консульта-</text>
  <text x="675" y="485" font-size="10" fill="#1e293b" text-anchor="middle">ційний форум курсу</text>

  <!-- Gateway Join Content (Parallel AND) -->
  <polygon points="805,365 830,390 805,415 780,390" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="805" y="396" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">+</text>
  <text x="805" y="435" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">Синхронізація</text>
  <text x="805" y="447" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">наповнення</text>

  <!-- Task Configure Enrollment -->
  <rect x="860" y="350" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="925" y="385" font-size="11" fill="#1e293b" text-anchor="middle">Налаштувати методи</text>
  <text x="925" y="400" font-size="11" fill="#1e293b" text-anchor="middle">зарахування та</text>
  <text x="925" y="415" font-size="11" fill="#1e293b" text-anchor="middle">кодове слово</text>

  <!-- Task Audit Course (Manager) -->
  <rect x="860" y="110" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="925" y="145" font-size="11" fill="#1e293b" text-anchor="middle">Провести аудит</text>
  <text x="925" y="160" font-size="11" fill="#1e293b" text-anchor="middle">наповнення та</text>
  <text x="925" y="175" font-size="11" fill="#1e293b" text-anchor="middle">налаштувань курсу</text>

  <!-- Gateway Audit Check (XOR) -->
  <polygon points="1055,125 1080,150 1055,175 1030,150" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="1055" y="115" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Вимоги до курсу виконано?</text>

  <!-- Task Notify Rework -->
  <rect x="1120" y="110" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="1185" y="145" font-size="11" fill="#1e293b" text-anchor="middle">Надіслати зауваження</text>
  <text x="1185" y="160" font-size="11" fill="#1e293b" text-anchor="middle">викладачу на</text>
  <text x="1185" y="175" font-size="11" fill="#1e293b" text-anchor="middle">доопрацювання</text>

  <!-- Task Publish Course (System LMS) -->
  <rect x="1120" y="555" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="1185" y="590" font-size="11" fill="#1e293b" text-anchor="middle">Опублікувати курс</text>
  <text x="1185" y="605" font-size="11" fill="#1e293b" text-anchor="middle">та відкрити доступ</text>
  <text x="1185" y="620" font-size="11" fill="#1e293b" text-anchor="middle">у каталозі</text>

  <!-- End Event Published -->
  <circle cx="1308" cy="595" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="3.5" />
  <text x="1308" y="630" font-size="10" fill="#065f46" text-anchor="middle">Курс успішно</text>
  <text x="1308" y="642" font-size="10" fill="#065f46" text-anchor="middle">опубліковано у каталозі</text>

  <!-- Annotation 2 -->
  <path d="M 520 540 L 500 540 L 500 595 L 520 595" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="510" y="560" font-size="10" fill="#475569">Паралельне формування контенту</text>
  <text x="510" y="575" font-size="10" fill="#475569">згідно зі стандартом дисципліни</text>
  <path d="M 570 540 L 550 410" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Sequence Flows (Strict fill="none") -->
  <path d="M 268 150 L 310 150" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 380 190 L 380 390 L 430 390" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 480 390 L 520 390" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Fork to 4 branches -->
  <path d="M 545 365 L 545 295 L 610 295" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 560 380 L 560 355 L 610 355" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 560 400 L 560 415 L 610 415" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 545 415 L 545 475 L 610 475" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4 branches to Join -->
  <path d="M 740 295 L 805 295 L 805 365" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 740 355 L 790 355 L 790 380" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 740 415 L 790 415 L 790 400" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 740 475 L 805 475 L 805 415" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Join to Enrollment -->
  <path d="M 830 390 L 860 390" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Enrollment to Audit -->
  <path d="M 925 350 L 925 190" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Audit to Gateway -->
  <path d="M 990 150 L 1030 150" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Gateway branches -->
  <path d="M 1080 150 L 1120 150" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1092" y="142" font-size="11" fill="#dc2626" font-weight="bold">Ні</text>

  <path d="M 1055 175 L 1055 595 L 1120 595" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1062" y="210" font-size="11" fill="#16a34a" font-weight="bold">Так</text>

  <!-- Rework Loop back to XOR Merge Gateway (NO DEADLOCK) -->
  <path d="M 1185 110 L 1185 60 L 455 60 L 455 365" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="750" y="52" font-size="10" fill="#b45309" font-weight="600">Петля доопрацювання курсу (вхід у XOR Merge)</text>

  <!-- Publish to End -->
  <path d="M 1250 595 L 1290 595" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Data association -->
  <path d="M 380 110 L 380 65" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>
